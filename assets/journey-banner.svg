<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Aarya Balwadkar — Frontend Developer, Python, Edge AI and IoT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171006"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0" r="0.75">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30363d"/>
      <stop offset="1" stop-color="#21262d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#30363d" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Left content -->
  <g>
    <text x="62" y="142" font-size="58" font-weight="800" letter-spacing="-0.5" fill="#ffffff">Aarya Balwadkar</text>
    <text x="64" y="176" font-size="20" font-weight="600" fill="#e6edf3">Frontend Developer <tspan fill="#6e7681">·</tspan> Python <tspan fill="#6e7681">·</tspan> Edge AI &amp; IoT</text>
    <text x="64" y="206" font-size="15" fill="#8b949e">Edge AI systems, real-time IoT pipelines &amp; web experiences people actually use.</text>

    <g font-size="13" font-weight="700">
      <rect x="64" y="232" width="118" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <text x="123" y="254" text-anchor="middle" fill="#fbbf24">Edge AI</text>

      <rect x="192" y="232" width="138" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
      <text x="261" y="254" text-anchor="middle" fill="#fbbf24">IoT Streaming</text>

      <rect x="340" y="232" width="158" height="34" rx="17" fill="#f97316"/>
      <text x="419" y="254" text-anchor="middle" fill="#0d1117">React + Python</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="640" y1="60" x2="640" y2="300" stroke="#30363d" stroke-opacity="0.8" stroke-width="1.5"/>

  <!-- Right code card -->
  <g>
    <rect x="680" y="60" width="456" height="240" rx="14" fill="#010409" stroke="url(#cardBorder)" stroke-width="1.5"/>
    <circle cx="708" cy="86" r="6" fill="#ff5f57"/>
    <circle cx="730" cy="86" r="6" fill="#febc2e"/>
    <circle cx="752" cy="86" r="6" fill="#28c840"/>
    <text x="776" y="91" font-size="12" font-weight="600" fill="#6e7681" letter-spacing="1">aarya — zsh</text>
    <line x1="680" y1="104" x2="1136" y2="104" stroke="#21262d" stroke-width="1"/>

    <g font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14">
      <text x="704" y="138"><tspan fill="#ff7b72">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
      <text x="704" y="162" fill="#7ee787">→ frontend · python · edge-ai</text>
      <text x="704" y="190"><tspan fill="#ff7b72">$</tspan><tspan fill="#e6edf3"> ls ~/builds</tspan></text>
      <text x="704" y="214" fill="#79c0ff">agricnxedge-web/  crop-health-mlops/</text>
      <text x="704" y="238" fill="#79c0ff">realtime-iot-telemetry/  fort-game/</text>
      <text x="704" y="266"><tspan fill="#ff7b72">$</tspan><tspan fill="#e6edf3"> status</tspan><tspan fill="#ffa657">  ● shipping daily</tspan><tspan fill="#7ee787"> ▊</tspan></text>
    </g>
  </g>
</svg>
