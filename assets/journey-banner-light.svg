<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Aarya Balwadkar — Frontend Developer, Python, Edge AI and IoT">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.22" cy="0" r="0.75">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="gridL" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#111827" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bgL)"/>
  <rect width="1200" height="360" rx="20" fill="url(#gridL)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowL)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentL)"/>

  <!-- Left content -->
  <g>
    <text x="62" y="142" font-size="58" font-weight="800" letter-spacing="-0.5" fill="#111827">Aarya Balwadkar</text>
    <text x="64" y="176" font-size="20" font-weight="600" fill="#374151">Frontend Developer <tspan fill="#9ca3af">·</tspan> Python <tspan fill="#9ca3af">·</tspan> Edge AI &amp; IoT</text>
    <text x="64" y="206" font-size="15" fill="#6b7280">Edge AI systems, real-time IoT pipelines &amp; web experiences people actually use.</text>

    <g font-size="13" font-weight="700">
      <rect x="64" y="232" width="118" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="123" y="254" text-anchor="middle" fill="#c2410c">Edge AI</text>

      <rect x="192" y="232" width="138" height="34" rx="17" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="261" y="254" text-anchor="middle" fill="#c2410c">IoT Streaming</text>

      <rect x="340" y="232" width="158" height="34" rx="17" fill="#f97316"/>
      <text x="419" y="254" text-anchor="middle" fill="#ffffff">React + Python</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="640" y1="60" x2="640" y2="300" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Right code card -->
  <g>
    <rect x="680" y="60" width="456" height="240" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="708" cy="86" r="6" fill="#ff5f57"/>
    <circle cx="730" cy="86" r="6" fill="#febc2e"/>
    <circle cx="752" cy="86" r="6" fill="#28c840"/>
    <text x="776" y="91" font-size="12" font-weight="600" fill="#6b7280" letter-spacing="1">aarya — zsh</text>
    <line x1="680" y1="104" x2="1136" y2="104" stroke="#f3f4f6" stroke-width="1"/>

    <g font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="14">
      <text x="704" y="138"><tspan fill="#cf222e">$</tspan><tspan fill="#24292f"> whoami</tspan></text>
      <text x="704" y="162" fill="#1a7f37">→ frontend · python · edge-ai</text>
      <text x="704" y="190"><tspan fill="#cf222e">$</tspan><tspan fill="#24292f"> ls ~/builds</tspan></text>
      <text x="704" y="214" fill="#0969da">agricnxedge-web/  crop-health-mlops/</text>
      <text x="704" y="238" fill="#0969da">realtime-iot-telemetry/  fort-game/</text>
      <text x="704" y="266"><tspan fill="#cf222e">$</tspan><tspan fill="#24292f"> status</tspan><tspan fill="#c2410c">  ● shipping daily</tspan><tspan fill="#1a7f37"> ▊</tspan></text>
    </g>
  </g>
</svg>
